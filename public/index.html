<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Authorized Live Streaming Console</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <header>
      <h1>合规影视直播管理后台</h1>
      <p>仅用于自有或已授权内容；使用平台官方提供的推流地址，不提供账号自动化或风控规避能力。</p>
    </header>

    <main>
      <section class="card">
        <h2>管理员登录</h2>
        <form id="login-form">
          <label>ADMIN_TOKEN
            <input id="token" type="password" autocomplete="current-password" required>
          </label>
          <button type="submit">登录</button>
        </form>
      </section>

      <section class="card">
        <h2>新建直播任务</h2>
        <form id="stream-form">
          <div class="grid">
            <label>名称<input name="name" required></label>
            <label>平台
              <select name="platform">
                <option value="bilibili">bilibili</option>
                <option value="douyin">抖音</option>
              </select>
            </label>
            <label>版权方/所有者<input name="owner" required></label>
            <label>授权编号<input name="licenseRef" required></label>
            <label>官方推流地址<input name="ingestUrl" placeholder="rtmp:// 或 srt://" required></label>
            <label>官方控制台地址<input name="officialConsoleUrl"></label>
            <label>视频源标题<input name="sourceTitle" required></label>
            <label>视频源 URL/本地绝对路径<input name="sourceUrl" required></label>
            <label>开始时间<input name="startAt" type="datetime-local"></label>
            <label>结束时间<input name="endAt" type="datetime-local"></label>
            <label>最大重试次数<input name="maxRetries" type="number" min="0" max="20" value="3"></label>
            <label>重试间隔秒<input name="backoffSeconds" type="number" min="1" value="30"></label>
            <label>告警 Webhook<input name="webhookUrl"></label>
            <label>告警邮箱<input name="email" type="email"></label>
          </div>
          <label class="check"><input name="authorized" type="checkbox" required> 我确认视频源为自有或已获得直播授权</label>
          <button type="submit">创建任务</button>
        </form>
      </section>

      <section class="card">
        <h2>直播任务</h2>
        <div id="streams"></div>
      </section>

      <section class="card">
        <h2>监控</h2>
        <pre id="metrics">未加载</pre>
      </section>

      <section class="card">
        <h2>异常告警</h2>
        <div id="alerts"></div>
      </section>

      <section class="card">
        <h2>审计日志</h2>
        <div id="audit"></div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
